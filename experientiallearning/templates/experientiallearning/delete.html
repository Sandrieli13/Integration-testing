{% extends "base_el.html" %}
{% load static %}
{% block title %}Delete account · Career readiness{% endblock %}
{% block el_content %}
{% include 'experientiallearning/_messages.html' %}
<section class="sub-header">
    <h1>DELETE ACCOUNT</h1>
</section>
<section class="form-container">
    <form action="{% url 'experientiallearning:delete_submit' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="cuny-id">Enter your CUNY EMPL ID:</label>
            <input type="text" id="cuny-id" name="cunyEMPLD" required>
        </div>
        <div class="form-group">
            <button type="submit" class="submit-btn">Delete Account</button>
        </div>
    </form>
</section>
{% endblock %}
