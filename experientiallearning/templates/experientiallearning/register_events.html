{% extends "base_el.html" %}
{% load static %}
{% block title %}Register for events · Career readiness{% endblock %}
{% block el_content %}
{% include 'experientiallearning/_messages.html' %}
<section class="sub2-header">
  <h1>REGISTER FOR EVENTS</h1>
</section>

<form method="post" action="{% url 'experientiallearning:register_events' %}" style="margin: 1rem 5%;">
  {% csrf_token %}
  <input type="text" name="cunyEMPLD" placeholder="CUNY EMPLID">
  <button type="submit">Register Events</button>
</form>

{% if message %}
  <p style="margin: 0 5%;">{{ message }}</p>
{% endif %}
{% endblock %}
