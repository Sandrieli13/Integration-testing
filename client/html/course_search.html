{% extends 'base.html' %}

{% block title %}Course search{% endblock %}

{% block content %}
<div class="bmc-page">
  <header class="bmc-page-hero">
  <div class="bmc-page-hero__panel">
    <p class="bmc-page-hero__eyebrow">Academics</p>
        <h1>Course search</h1>
        <p class="bmc-page-hero__lede">Choose your major to see courses and prerequisites.</p>
  </div>
</header>

  <div class="bmc-card" style="max-width: 32rem;">
    <form method="post" class="bmc-form">
      {% csrf_token %}
      <label for="major">Major</label>
      <select name="major" id="major">
        {% for major in majors %}
          <option value="{{ major.major_id }}">{{ major.major_name }}</option>
        {% endfor %}
      </select>
      <div class="bmc-form__actions">
        <button type="submit" name="search" value="1" class="bmc-btn bmc-btn--primary">Search</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
